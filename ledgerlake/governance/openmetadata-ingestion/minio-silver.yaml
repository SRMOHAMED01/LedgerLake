# OpenMetadata Ingestion Workflow for MinIO Silver Layer
# Run with: python -m metadata.cmd.ingest --config governance/openmetadata-ingestion/minio-silver.yaml

source:
  type: "s3"
  serviceName: "ledgerlake-minio-silver"
  serviceConnection:
    config:
      type: "S3"
      endpointURL: "http://minio:9000"
      awsAccessKeyId: "ledgerlake"
      awsSecretAccessKey: "changeme"
      awsRegion: "us-east-1"
      verifySSL: false
  sourceConfig:
    config:
      type: "FileMetadata"
      path: "silver/"
      fileExtensions:
        - ".parquet"
      enableDebugLog: true

processor:
  type: "orm-profiler"
  config:
    profileSample: 85.0
    profileColumns: []

sink:
  type: "metadata-rest"
  config:
    type: "metadata-rest"
    metadataServer: "http://openmetadata-server:8585/api"
    authProvider: "no-auth"

workflowConfig:
  openMetadataServerConfig:
    hostPort: "http://openmetadata-server:8585/api"
    authProvider: "no-auth"