# ============================================================
# docker-compose.yml — Orchestration complète LedgerLake
# ============================================================
# À COMPLÉTER (Palier G). Services attendus :
#   - zookeeper + kafka       : broker d'événements (Palier A)
#   - minio                    : data lake S3-compatible (Palier A)
#   - spark-master + spark-worker : moteur de calcul (Palier B)
#   - airflow-webserver + airflow-scheduler : orchestration (Palier E)
#   - openmetadata + ses dépendances (elasticsearch, mysql) : gouvernance (Palier F)
#   - prometheus + grafana       : observabilité (Palier G)
#
# Conseil : commence par zookeeper + kafka + minio (Palier A) uniquement,
# ajoute les autres services au fur et à mesure des paliers suivants.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      - minio
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        do sleep 2; done;
        mc mb --ignore-existing local/bronze;
        mc mb --ignore-existing local/silver;
        mc mb --ignore-existing local/silver-rejected

  
  # TODO Palier E : airflow-webserver, airflow-scheduler, postgres (metadata Airflow)
  # TODO Palier F : openmetadata + elasticsearch + mysql
  # TODO Palier G : prometheus, grafana

volumes:
  minio_data:

