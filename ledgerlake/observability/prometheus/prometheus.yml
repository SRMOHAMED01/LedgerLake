# prometheus.yml — Config de scraping (Palier G.1)
# À COMPLÉTER : scrape_configs pointant vers les exporters de métriques
# Kafka (kafka-exporter), Spark (metrics natifs), et Airflow
# (statsd-exporter branché sur AIRFLOW__METRICS__STATSD_ON=True)

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
  - job_name: 'airflow'
    static_configs:
      - targets: ['statsd-exporter:9102']
